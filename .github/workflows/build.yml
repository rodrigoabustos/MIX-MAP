name: Build Mix Map

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la

      - name: Unit tests
        run: cd "$(dirname "$(find . -maxdepth 2 -name CMakeLists.txt | head -1)")" && c++ -std=c++17 -Wall -Wextra tests.cpp -I . -o mixmap_tests && ./mixmap_tests

      - name: Configure
        run: cd "$(dirname "$(find . -maxdepth 2 -name CMakeLists.txt | head -1)")" && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build VST3
        run: cd "$(dirname "$(find . -maxdepth 2 -name CMakeLists.txt | head -1)")" && cmake --build build --config Release --target MixMap_VST3 --parallel 4

      - name: Sign and package DMG
        run: cd "$(dirname "$(find . -maxdepth 2 -name CMakeLists.txt | head -1)")" && PLUGIN="$(find build -name 'Mix Map.vst3' -type d | head -1)" && codesign --force --deep --sign - "$PLUGIN" && codesign --verify --deep --strict "$PLUGIN" && mkdir dmgroot && cp -R "$PLUGIN" dmgroot/ && cp INSTALL.txt dmgroot/ && hdiutil create -volname "Mix Map" -srcfolder dmgroot -ov -format UDZO MixMap.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with: { name: MixMap-dmg, path: '**/MixMap.dmg' }
