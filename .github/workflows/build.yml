name: Build Mix Map
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Unit tests (calculations)
        run: |
          c++ -std=c++17 -Wall -Wextra Tests/tests.cpp -I Source/Core -o mixmap_tests
          ./mixmap_tests
 
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
 
      - name: Build VST3
        run: cmake --build build --config Release --target MixMap_VST3 --parallel 4
 
      - name: Sign (ad-hoc) and package DMG
        run: |
          PLUGIN="$(find build -name 'Mix Map.vst3' -type d | head -1)"
          echo "Plugin: $PLUGIN"
          codesign --force --deep --sign - "$PLUGIN"
          codesign --verify --deep --strict "$PLUGIN"
          lipo -archs "$PLUGIN"/Contents/MacOS/* || true
          mkdir dmgroot
          cp -R "$PLUGIN" dmgroot/
          cp INSTALL.txt dmgroot/INSTALL.txt
          hdiutil create -volname "Mix Map" -srcfolder dmgroot -ov -format UDZO MixMap.dmg
          ls -la MixMap.dmg
 
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MixMap-dmg
          path: MixMap.dmg
 




